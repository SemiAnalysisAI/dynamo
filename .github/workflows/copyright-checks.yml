name: Copyright Checks

on:
  pull_request

jobs:
  copyright-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # The checker compares header years with each file's last commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Check copyright headers
        # Git and PowerShell are included in the hosted Ubuntu runner image.
        run: pwsh -NoProfile -File .github/workflows/copyright-check.ps1
        env:
          NVBUILD_VERBOSITY: DETAILED
        timeout-minutes: 15
