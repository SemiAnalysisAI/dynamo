# Dependabot config. Added 2026-10-22 (dependency sweep).
# Security updates are grouped into one PR per entry.
# open-pull-requests-limit: 0 stops new version-update PRs.
# Security updates still open with that setting.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
